name: CI

# Gate for changes before they reach `main`. `main` auto-deploys to GitHub
# Pages (see static.yml), so nothing here deploys — it only verifies.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      # Lint is intentionally NOT gated yet: `pnpm run lint` currently reports
      # 2 pre-existing react-hooks/set-state-in-effect errors on main
      # (command-palette.tsx:35, i18n.tsx:68). Re-enable once those are fixed.
      - name: Test (vitest)
        run: pnpm --filter @workspace/qualitracker-website test
      - name: Test (node:test — waitlist email; needs Node 22.18+ for TS type stripping)
        run: pnpm --filter @workspace/qualitracker-website test:node
      - name: Install Chrome for prerendering
        run: pnpm --filter @workspace/qualitracker-website exec puppeteer browsers install chrome
      - name: Build (includes prerender)
        env:
          BASE_PATH: /
        run: pnpm --filter @workspace/qualitracker-website build
