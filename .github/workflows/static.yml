name: Build and deploy website to Pages

# qualitracker.com is served by Firebase Hosting (see firebase-hosting.yml). GitHub
# Pages is unpublished, so this workflow is manual-only to avoid a failing run on every
# push to main. Re-publish Pages in repo settings before running it again.
on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome for prerendering
        run: pnpm --filter @workspace/qualitracker-website exec puppeteer browsers install chrome
      - name: Build website
        env:
          BASE_PATH: /
        run: pnpm --filter @workspace/qualitracker-website build
      - name: Disable Jekyll processing
        run: touch artifacts/qualitracker-website/dist/public/.nojekyll
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/qualitracker-website/dist/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
